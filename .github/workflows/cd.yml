name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  airflow-image:
    name: Build and publish Airflow image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image for checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          load: true
          tags: banking-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check DAG imports inside image
        run: |
          docker run --rm -v "$PWD/ci:/ci" banking-airflow:ci \
            bash -c "airflow db migrate > /dev/null && python /ci/check_dags.py"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/airflow
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.COMMIT_SHA }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  dbt-docs:
    name: Publish dbt docs to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: bank
          CLICKHOUSE_PASSWORD: bank
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client -u bank --password bank -q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: banking_dbt/requirements.txt

      - name: Install dbt
        run: pip install -r banking_dbt/requirements.txt

      - name: Create raw layer and load fixtures
        run: |
          for f in clickhouse/init/*.sql ci/fixtures/raw_phase1.sql; do
            echo "Applying $f"
            docker exec -i ${{ job.services.clickhouse.id }} \
              clickhouse-client -u bank --password bank --multiquery < "$f"
          done

      - name: Build models (docs need real tables for the catalog)
        working-directory: banking_dbt
        run: dbt build --target ci --exclude tag:ci

      - name: Generate docs
        working-directory: banking_dbt
        run: dbt docs generate --target ci --static

      - name: Prepare site
        run: |
          mkdir -p site
          cp banking_dbt/target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4