name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  dbt:
    name: dbt build on ClickHouse
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: bank
          CLICKHOUSE_PASSWORD: bank
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client -u bank --password bank -q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: banking_dbt/requirements.txt

      - name: Install dbt
        run: pip install -r banking_dbt/requirements.txt

      - name: Create raw layer
        run: |
          for f in clickhouse/init/*.sql; do
            echo "Applying $f"
            docker exec -i ${{ job.services.clickhouse.id }} \
              clickhouse-client -u bank --password bank --multiquery < "$f"
          done

      - name: dbt debug
        working-directory: banking_dbt
        run: dbt debug

      - name: dbt build
        working-directory: banking_dbt
        run: dbt build