banking_dbt:
  target: dev
  outputs:
    dev: &clickhouse
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'bank') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'bank') }}"
      schema: analytics
      threads: 4
    ci: *clickhouse